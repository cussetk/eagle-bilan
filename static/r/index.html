<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ton bilan bien-être · 97 Eagle Team</title>
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="/assets/logo-embleme.webp">
<link rel="stylesheet" href="/fonts.css">
<style>
/* Rapport client : une page claire et chaleureuse, lisible sur téléphone, exportable en PDF. */
:root { --forest: #1F7A2A; --lime: #7AC143; --lime-soft: #EEF7E6; --ink: #152033; --muted: #5A6577; --line: #DCE8D3; --sun: #FFD25A; --bg: #F3F7F0; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Figtree", "Segoe UI", Arial, sans-serif; -webkit-font-smoothing: antialiased; }
h1, h2, h3 { font-family: "Archivo", "Arial Narrow", Arial, sans-serif; font-stretch: 110%; margin: 0; line-height: 1.08; text-wrap: balance; }
p { margin: 0; line-height: 1.5; }
.wrap { max-width: 860px; margin: 0 auto; padding: 18px 16px 60px; display: grid; gap: 16px; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 14px 20px; border-radius: 14px; font-weight: 800; font-size: 17px; text-decoration: none; border: 2px solid transparent; cursor: pointer; font-family: inherit; }
.btn-primary { background: var(--forest); color: #fff; box-shadow: 0 4px 0 #145119; }
.btn-ghost { background: #fff; color: var(--forest); border-color: var(--line); }
.btn-wa { background: #1FAF55; color: #fff; }
.btn[disabled] { opacity: .6; cursor: progress; }
#rapport { background: #fff; border-radius: 22px; overflow: hidden; box-shadow: 0 2px 4px rgba(21,32,51,.05), 0 20px 50px rgba(21,32,51,.1); }
.head { padding: 26px 26px 22px; background: radial-gradient(120% 120% at 100% 0%, #9BD86A 0%, var(--forest) 50%, #0F3D16 100%); color: #fff; display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: center; }
.head h1 { color: #fff; font-size: clamp(26px, 5vw, 38px); font-weight: 900; }
.head p { opacity: .92; margin-top: 6px; }
.head img { width: 92px; background: #fff; border-radius: 16px; padding: 8px; }
.sec { padding: 22px 26px; display: grid; gap: 14px; border-top: 1px solid var(--line); }
.eyebrow { font-weight: 800; text-transform: uppercase; letter-spacing: .09em; font-size: 12px; color: var(--forest); }
.score { display: grid; grid-template-columns: 240px 1fr; gap: 22px; align-items: center; }
.gauge { position: relative; }
.gauge svg { width: 100%; display: block; }
.gauge .v { position: absolute; left: 0; right: 0; bottom: 4px; text-align: center; }
.gauge .v b { font-family: "Archivo", Arial, sans-serif; font-size: 58px; font-weight: 900; line-height: 1; }
.gauge .v span { color: var(--muted); font-weight: 800; }
.pill { display: inline-block; padding: 4px 12px; border-radius: 99px; font-weight: 800; font-size: 13px; border: 1px solid currentColor; }
.bars { display: grid; gap: 10px; }
.bar-row { display: grid; grid-template-columns: 140px 1fr 40px; gap: 10px; align-items: center; font-weight: 700; font-size: 15px; }
.bar { height: 14px; background: #E8F0E2; border-radius: 99px; overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 99px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.box { padding: 16px; border-radius: 16px; background: var(--lime-soft); border: 1px solid var(--line); display: grid; gap: 10px; }
.box.white { background: #fff; }
ul.l { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
ul.l li { display: flex; gap: 10px; align-items: flex-start; font-weight: 600; }
ul.l li::before { content: "✓"; flex: none; width: 22px; height: 22px; border-radius: 99px; background: #22A06B; color: #fff; display: grid; place-items: center; font-size: 13px; font-weight: 900; }
ul.l.ax li::before { content: "→"; background: var(--forest); }
.pot { display: flex; gap: 16px; align-items: center; }
.pot b.big { font-family: "Archivo", Arial, sans-serif; font-size: 44px; font-weight: 900; color: var(--forest); line-height: 1; }
.ebook { display: grid; grid-template-columns: 120px 1fr; gap: 18px; align-items: center; }
.ebook .cover { aspect-ratio: 210 / 297; border-radius: 10px; background: radial-gradient(120% 80% at 100% 0%, #9BD86A 0%, var(--forest) 50%, #0F3D16 100%); color: #fff; padding: 10px; display: grid; align-content: end; font-family: "Archivo", Arial, sans-serif; font-weight: 900; font-size: 14px; line-height: 1.05; box-shadow: 8px 10px 0 rgba(21,32,51,.08), 0 12px 24px rgba(21,32,51,.2); transform: perspective(500px) rotateY(-12deg); }
.ebook .cover span { color: var(--sun); }
.legal { font-size: 12px; color: var(--muted); }
.center { text-align: center; }
.empty { background: #fff; border-radius: 20px; padding: 40px 24px; text-align: center; display: grid; gap: 12px; justify-items: center; }
@media (max-width: 640px) { .score, .two { grid-template-columns: 1fr; } .gauge { max-width: 260px; margin: 0 auto; } .head { grid-template-columns: 1fr; } .head img { width: 76px; } .bar-row { grid-template-columns: 110px 1fr 36px; } .ebook { grid-template-columns: 90px 1fr; } .sec { padding: 18px; } }
.pdf-mode .actions-in, .pdf-mode .no-pdf { display: none !important; }
.pdf-mode h1, .pdf-mode h2, .pdf-mode h3 { text-wrap: wrap; font-stretch: 100%; }
</style>
</head>
<body>
<div class="wrap" id="app"><div class="empty"><img src="/assets/logo-full.webp" alt="97 Eagle Team" width="120"><b>Chargement de ton bilan…</b></div></div>
<script src="/r/r.js" defer></script>
</body>
</html>
